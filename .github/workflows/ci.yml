name: CI

# Doc 07 §3: "Type checking and linting must pass in CI from milestone 0."
#
# Until Phase 0 this workflow ran the suite with **no database**, so 92 tests
# skipped and the job reported green — row-level security, the product's central
# claim, was never exercised anywhere. The `postgres` service below is the whole
# point of this file: the api job now boots a real PostgreSQL, bootstraps the
# unprivileged application role, migrates in both directions, and refuses to
# pass if a database test skips (`tests/test_ci_contract.py`).
#
# `.\scripts\ci.ps1` runs the same checks locally.

on:
  push:
    # `dev` as well as `main`. Work happens on `dev` and lands on `main`, so a
    # workflow triggered only by `main` would run after the fact - and this one
    # exists to catch a broken policy or a drifted constraint before it is
    # merged, not to confirm it afterwards.
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API — lint, types, tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api

    env:
      # `NEXUS_ENV` has no default since Phase 1 — a forgotten one used to mean
      # `local`, which served /docs publicly and set secure=False on both
      # cookies. So it must be set here: `conftest.py` pins it for tests, but
      # `alembic` builds Settings of its own and there is no `.env` in CI, so
      # the migration step would refuse to start without this line.
      NEXUS_ENV: ci

    services:
      postgres:
        # pgvector, not plain postgres. `db/bootstrap.sql` runs
        # `CREATE EXTENSION vector` and the official image does not ship it, so
        # the bootstrap would fail on the first statement. ADR 0006 chose this
        # image for the same reason locally.
        #
        # POSTGRES_USER is a superuser in this image — which is exactly why the
        # bootstrap creates a separate `nexus_app`. A superuser, or any role
        # with BYPASSRLS, ignores every policy in migration 0002 while the
        # isolation suite passes.
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nexus
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nexus"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          # The lockfile, not pyproject.toml — the cache key must change when
          # the resolved set changes, and pyproject only states ranges.
          cache-dependency-path: services/api/requirements-dev.lock

      - name: Install
        # From the lockfile, not from the ranges in pyproject.toml (finding #16).
        #
        # `pip install -e ".[dev]"` resolved whatever was newest each morning, so
        # CI ran a different environment from every developer, every run. That is
        # how `beautifulsoup4` went undeclared for four milestones — present
        # locally by accident, absent here — and how an `anyio`/`starlette`
        # deprecation broke collection with nothing in the repo having changed.
        #
        # `--require-hashes` is implied by the hashes in the file: pip refuses
        # the whole install if any artefact does not match. Then the project
        # itself, `--no-deps`, because its dependencies are already pinned above
        # and letting pip re-resolve them would defeat the point.
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.lock
          pip install -e . --no-deps

      - name: Install the postgres client
        working-directory: .
        run: |
          sudo apt-get update -qq
          sudo apt-get install -yqq --no-install-recommends postgresql-client

      - name: Bootstrap the database and the application role
        working-directory: .
        env:
          PGPASSWORD: postgres
        run: |
          APP_PASSWORD="$(openssl rand -hex 24)"
          JOBS_PASSWORD="$(openssl rand -hex 24)"
          echo "::add-mask::$APP_PASSWORD"
          echo "::add-mask::$JOBS_PASSWORD"
          psql -h localhost -U postgres -d nexus \
               -v app_password="$APP_PASSWORD" \
               -v jobs_password="$JOBS_PASSWORD" -f db/bootstrap.sql
          echo "NEXUS_DATABASE_URL=postgresql+asyncpg://nexus_app:$APP_PASSWORD@localhost:5432/nexus" \
               >> "$GITHUB_ENV"
          # The maintenance role (ADR 0018). Without it the expiry sweep runs as
          # nexus_app, matches zero rows under the domain_claim policy, and
          # reports success - so the suite would be green over a broken sweep.
          echo "NEXUS_JOBS_DATABASE_URL=postgresql+asyncpg://nexus_jobs:$JOBS_PASSWORD@localhost:5432/nexus" \
               >> "$GITHUB_ENV"

      - name: Migrations, both directions
        # upgrade → downgrade base → upgrade, on a clean database. A downgrade
        # that has never run is not a downgrade; it is a function that has never
        # been called, and the first person to need it will be mid-incident.
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (ruff)
        run: ruff format --check .

      - name: Types (mypy --strict)
        # `tests` as well as `app`. The suite is what proves the invariants, so
        # untyped test code is untyped proof.
        run: mypy app tests

      - name: Tests
        # `pytest -q` fails if NEXUS_DATABASE_URL is missing, if any
        # `requires_db` test skips, or if coverage falls below the floor. See
        # tests/test_ci_contract.py and [tool.pytest.ini_options].
        run: pytest -q

  web:
    name: Web — lint, types, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install
        run: npm ci

      - name: Types
        run: npx tsc --noEmit

      - name: Lint
        run: npx next lint

      - name: Component and BFF tests
        run: npm test

      - name: Build
        run: npx next build

  e2e:
    name: E2E — the journey, against the composed stack
    runs-on: ubuntu-latest
    # Not blocking **yet**, and this is a dated promise rather than a shrug.
    #
    # The stack builds and the database comes up healthy. `migrate` then refuses
    # to start, correctly: `NEXUS_ENV=production` forbids `NEXUS_MAILER_BACKEND=file`,
    # because a production process writing `.eml` files to disk is a production
    # process sending no mail. The journey reads the verification link out of
    # exactly those files.
    #
    # So the deployed stack needs a **real SMTP sink** — a mail-catcher service
    # in the CI override, with the journey reading the token from its API. That
    # is the next piece of work, and until it exists this job reports without
    # blocking. A permanently red required job teaches people to ignore CI,
    # which costs more than the job is worth.
    #
    # Remove this line the moment the sink lands.
    continue-on-error: true
    # After the cheap jobs. A browser journey that fails because of a type error
    # wastes four minutes proving something `tsc` proves in forty seconds.
    needs: [api, web]
    env:
      # Test credentials for a database that lives and dies with this job. Not
      # secrets: nothing here outlives the runner, and putting them in the repo
      # secret store would imply they protect something.
      NEXUS_DB_SUPERUSER_PASSWORD: ci-superuser-password
      NEXUS_APP_DB_PASSWORD: ci-app-password
      NEXUS_ENV: production
      NEXUS_DATABASE_URL: postgresql+asyncpg://nexus_app:ci-app-password@db:5432/nexus
      NEXUS_JOBS_DATABASE_URL: postgresql+asyncpg://nexus_jobs:ci-jobs-password@db:5432/nexus
      NEXUS_JOBS_DB_PASSWORD: ci-jobs-password
      NEXUS_SESSION_SIGNING_SECRET: ci-session-signing-secret-not-a-real-one
      NEXUS_STORAGE_SIGNING_SECRET: ci-storage-signing-secret-not-a-real-one
      NEXUS_PUBLIC_BASE_URL: https://localhost
      # `production` rather than a test env on purpose: it is the only setting
      # under which cookies are `secure` and the docs page is closed, and those
      # are two of the things this job exists to prove.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci

      - name: Install Chromium
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      # The journey reads the verification link out of the `.eml` the API
      # actually wrote. The bind mount in docker-compose.ci.yml needs the
      # directory to exist first, or Docker creates it owned by root and the
      # container cannot write to it.
      - name: Prepare the mail sink
        run: mkdir -p .mail && chmod 777 .mail

      - name: Build the images
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml build

      - name: Bring up the stack
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d

      # `migrate` is a job: it runs and exits. `api` and `worker` wait on it
      # completing successfully, so if it failed they never started and the wait
      # below is what surfaces it.
      - name: Wait for the site
        run: |
          for i in $(seq 1 60); do
            if curl -fsSk https://localhost/ >/dev/null 2>&1; then
              echo "up after ${i}0s"; exit 0
            fi
            sleep 10
          done
          echo "the site never answered"; exit 1

      # The reason the proxy exists. A session cookie marked secure is not sent
      # over plain HTTP, so a stack that serves the app but not TLS would pass
      # the journey and still be undeployable.
      - name: The session cookie is Secure and HttpOnly
        run: |
          set -euo pipefail
          headers=$(curl -sSk -D - -o /dev/null -X POST https://localhost/api/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"email":"nobody@example.om","password":"not-a-real-password"}')
          echo "$headers"
          # A failed login sets no session cookie, which is correct — so assert
          # on the CSRF cookie, which is set regardless and carries the same
          # flags. Asserting on a cookie that is never present would be a test
          # that cannot fail.
          echo "$headers" | grep -i '^set-cookie:.*nexus_csrf' | grep -qi 'Secure'
          echo "$headers" | grep -i '^set-cookie:.*nexus_csrf' | grep -qi 'HttpOnly'

      - name: The journey
        working-directory: apps/web
        env:
          NEXUS_E2E_BASE_URL: https://localhost
          NEXUS_E2E_MAIL_DIR: ../../.mail
        run: npx playwright test

      - name: What the stack said
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml logs --tail=200

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml down -v

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
