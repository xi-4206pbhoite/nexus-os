# Local infrastructure.
#
# Restores what ADR 0001 set aside when Docker was unavailable. ADR 0006
# supersedes 0004: pgvector arrives via the official image rather than being
# deferred, so M5 can hard-require the extension.
#
# The object store and mailer remain the filesystem drivers from ADR 0001 — they
# work, they are tested, and containerising them would add moving parts to
# replace something that is not a problem.
#
# **Four services and one job.** `db`, `api`, `web`, `worker` — and `migrate`,
# which is a job rather than a service: it runs `alembic upgrade head`, exits,
# and everything that needs a migrated schema waits for it to exit zero.
#
# Migrations are **not** an application-startup side effect. Three API replicas
# starting together would each try to migrate; whichever loses takes a lock and
# blocks, or worse, half-applies. A schema change is a deploy step you can watch
# fail, not something that happens invisibly during a rollout.
#
# `api` and `worker` are the **same image with different commands**. They are
# the same application — the worker runs the scheduler and, from P11, the
# research jobs — and a second image built from the same source is a second
# thing to keep in step with the first.
#
# Usage:
#   docker compose up -d              # the whole stack
#   docker compose up -d db           # just the database, as before
#   docker compose run --rm migrate   # migrate without starting anything else
#   docker compose logs -f api
#   docker compose down               # keeps data
#   docker compose down -v            # destroys data

services:
  db:
    # Official pgvector image, tracking the Postgres version the native cluster
    # already ran, so switching between them is not also a major-version jump.
    image: pgvector/pgvector:pg17
    container_name: nexus-db
    restart: unless-stopped
    environment:
      # Superuser. Owns extensions and runs migrations; the application never
      # connects as this — see docker/postgres/init/01-app-role.sh.
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${NEXUS_DB_SUPERUSER_PASSWORD:?set NEXUS_DB_SUPERUSER_PASSWORD in .env}
      POSTGRES_DB: nexus
      # Consumed by the init script to create the non-superuser app role.
      NEXUS_APP_DB_PASSWORD: ${NEXUS_APP_DB_PASSWORD:?set NEXUS_APP_DB_PASSWORD in .env}
      # The maintenance role (ADR 0018). Defaults to the app password so a local
      # stack needs one fewer variable; give it its own in anything deployed,
      # because two roles sharing a secret is one role wearing two hats.
      NEXUS_JOBS_DB_PASSWORD: ${NEXUS_JOBS_DB_PASSWORD:-${NEXUS_APP_DB_PASSWORD}}
      # Deterministic collation, matching the native cluster's initdb.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      # Loopback only. This holds customer data and has no business being
      # reachable from the network.
      - "127.0.0.1:5432:5432"
    volumes:
      - nexus_pgdata:/var/lib/postgresql/data
      # Runs once, on an empty data volume.
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
      # The shared bootstrap SQL, mounted rather than copied so local and
      # production provably run the same file.
      - ./db:/bootstrap:ro
    healthcheck:
      # `pg_isready` alone reports the server is accepting connections before
      # the init scripts have finished, so readiness is asserted against the
      # thing that actually matters: the extension being present.
      test:
        [
          "CMD-SHELL",
          "psql -U postgres -d nexus -tAc \"SELECT 1 FROM pg_extension WHERE extname='vector'\" | grep -q 1",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  # ── Migrations, as their own step ──────────────────────────
  migrate:
    build:
      context: ./services/api
    image: nexus-api
    environment:
      NEXUS_ENV: ${NEXUS_ENV:-production}
      # Migrations run as the owner, which is the app role: `nexus_app` owns
      # every table, and that ownership is what makes FORCE ROW LEVEL SECURITY
      # settable at all. Running them as the superuser would silently reassign
      # ownership and leave RLS unenforceable on anything new.
      NEXUS_DATABASE_URL: ${NEXUS_DATABASE_URL:?set NEXUS_DATABASE_URL in .env}
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  # ── The API ────────────────────────────────────────────────
  api:
    build:
      context: ./services/api
    image: nexus-api
    restart: unless-stopped
    environment:
      NEXUS_ENV: ${NEXUS_ENV:-production}
      NEXUS_DATABASE_URL: ${NEXUS_DATABASE_URL:?set NEXUS_DATABASE_URL in .env}
      # Required whenever a database is configured: company registration checks
      # whether a domain is already claimed as `nexus_jobs`, because `workspace`
      # is row-level secured and the app role cannot see another company's row.
      NEXUS_JOBS_DATABASE_URL: ${NEXUS_JOBS_DATABASE_URL:?set NEXUS_JOBS_DATABASE_URL in .env}
      NEXUS_SESSION_SIGNING_SECRET: ${NEXUS_SESSION_SIGNING_SECRET:?set it in .env}
      NEXUS_STORAGE_SIGNING_SECRET: ${NEXUS_STORAGE_SIGNING_SECRET:?set it in .env}
      NEXUS_PUBLIC_BASE_URL: ${NEXUS_PUBLIC_BASE_URL:-https://localhost}
      # Off in the API. The worker owns it — see below.
      NEXUS_RUN_SCHEDULER: "false"
    volumes:
      - nexus_storage:/app/.storage
      - nexus_mail:/app/.mail
    depends_on:
      db:
        condition: service_healthy
      migrate:
        # Not "started". The API must not serve a request against a schema that
        # is mid-upgrade, and `service_completed_successfully` is the only
        # condition that means the migration finished *and* passed.
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8000:8000"

  # ── The worker: same image, different command ──────────────
  worker:
    build:
      context: ./services/api
    image: nexus-api
    restart: unless-stopped
    environment:
      NEXUS_ENV: ${NEXUS_ENV:-production}
      NEXUS_DATABASE_URL: ${NEXUS_DATABASE_URL:?set NEXUS_DATABASE_URL in .env}
      # Required whenever a database is configured: company registration checks
      # whether a domain is already claimed as `nexus_jobs`, because `workspace`
      # is row-level secured and the app role cannot see another company's row.
      NEXUS_JOBS_DATABASE_URL: ${NEXUS_JOBS_DATABASE_URL:?set NEXUS_JOBS_DATABASE_URL in .env}
      NEXUS_SESSION_SIGNING_SECRET: ${NEXUS_SESSION_SIGNING_SECRET:?set it in .env}
      NEXUS_STORAGE_SIGNING_SECRET: ${NEXUS_STORAGE_SIGNING_SECRET:?set it in .env}
      NEXUS_RUN_SCHEDULER: "true"
    command: ["python", "-m", "app.worker"]
    volumes:
      - nexus_storage:/app/.storage
      - nexus_mail:/app/.mail
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # ── The web app ────────────────────────────────────────────
  web:
    build:
      context: ./apps/web
    image: nexus-web
    restart: unless-stopped
    environment:
      # Reached over the compose network, not through the proxy. The BFF is
      # server-side; routing its calls back out through TLS to come in again
      # would add a hop and a certificate to a request that never leaves the
      # host.
      NEXUS_API_BASE_URL: http://api:8000
      NEXUS_PROXY_TIMEOUT_MS: ${NEXUS_PROXY_TIMEOUT_MS:-30000}
    depends_on:
      - api
    ports:
      - "127.0.0.1:3000:3000"

  # ── TLS termination ────────────────────────────────────────
  #
  # Here for one reason: `secure=True` cookies. A session cookie marked secure
  # is not sent over plain HTTP, so without TLS the whole session layer either
  # stops working or has to be weakened for local use — and a cookie flag that
  # is off in development is a flag nobody tests.
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - nexus_caddy_data:/data
      - nexus_caddy_config:/config
    depends_on:
      - web
      - api

volumes:
  nexus_pgdata:
    name: nexus_pgdata
  nexus_storage:
  nexus_mail:
  nexus_caddy_data:
  nexus_caddy_config:
