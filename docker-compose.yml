# Local infrastructure.
#
# Restores what ADR 0001 set aside when Docker was unavailable. ADR 0006
# supersedes 0004: pgvector arrives via the official image rather than being
# deferred, so M5 can hard-require the extension.
#
# Only the database is here. The object store and mailer remain the filesystem
# drivers from ADR 0001 — they work, they are tested, and containerising them
# would add moving parts to replace something that is not a problem.
#
# Usage:
#   docker compose up -d db
#   docker compose ps
#   docker compose down          # keeps data
#   docker compose down -v       # destroys data

services:
  db:
    # Official pgvector image, tracking the Postgres version the native cluster
    # already ran, so switching between them is not also a major-version jump.
    image: pgvector/pgvector:pg17
    container_name: nexus-db
    restart: unless-stopped
    environment:
      # Superuser. Owns extensions and runs migrations; the application never
      # connects as this — see docker/postgres/init/01-app-role.sh.
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${NEXUS_DB_SUPERUSER_PASSWORD:?set NEXUS_DB_SUPERUSER_PASSWORD in .env}
      POSTGRES_DB: nexus
      # Consumed by the init script to create the non-superuser app role.
      NEXUS_APP_DB_PASSWORD: ${NEXUS_APP_DB_PASSWORD:?set NEXUS_APP_DB_PASSWORD in .env}
      # Deterministic collation, matching the native cluster's initdb.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      # Loopback only. This holds customer data and has no business being
      # reachable from the network.
      - "127.0.0.1:5432:5432"
    volumes:
      - nexus_pgdata:/var/lib/postgresql/data
      # Runs once, on an empty data volume.
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
      # The shared bootstrap SQL, mounted rather than copied so local and
      # production provably run the same file.
      - ./db:/bootstrap:ro
    healthcheck:
      # `pg_isready` alone reports the server is accepting connections before
      # the init scripts have finished, so readiness is asserted against the
      # thing that actually matters: the extension being present.
      test:
        [
          "CMD-SHELL",
          "psql -U postgres -d nexus -tAc \"SELECT 1 FROM pg_extension WHERE extname='vector'\" | grep -q 1",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

volumes:
  nexus_pgdata:
    name: nexus_pgdata
