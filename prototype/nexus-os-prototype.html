<!--
  ============================================================================
  NEXUS OS — FULL CLICKABLE PROTOTYPE
  ============================================================================

  One file. The whole journey, in order:

      Landing page  →  preview audit  →  sign up  →  onboarding (7 steps)
                    →  sign in as one of eight people
                    →  that person's own workspace  →  admin portal

  No build step, no server, no network. Double-click to open. Send the file
  to share it.

  THE IDEA THIS PROTOTYPE EXISTS TO EXPLAIN

  The dashboard *is* the person. You sign in as somebody and their department is
  the entire application — their navigation, their layout, their vocabulary. A
  Sales manager has no Finance entry greyed out in the sidebar, because Finance
  was never part of their product. Navigation is assembled per user, not
  filtered per user.

  Two consequences worth pointing at in a demo:

    - Each department workspace is structurally different, not one grid with the
      labels swapped. Sales gets a pipeline board, Finance gets ageing buckets
      and an approvals queue, Operations gets a dispatch lane board.

    - A Contributor gets a genuinely smaller product — "my day, my deals, my
      targets" — rather than a manager's page with holes cut in it. That is what
      `contributor_restricted` in scopes.py actually means, and it reads as a
      deliberate design rather than a punishment.

  WHAT THIS IS NOT
  Not the application. No API, no database, no authentication, no enforcement.
  Nothing typed here is saved or sent. Signing in as a persona is a demo device;
  real scoping happens in Postgres row-level security and `retrieval/`.

  ON THE NUMBERS — read before showing anyone
  The product sells on "never invent a number" (invariant I1). Every figure here
  is invented. That is only acceptable because this is a mock rather than the
  running app, and the repo's content rule requires mocks to be visibly tagged:
  a fixed banner, an ILLUSTRATIVE marker on every tile and panel, a fictional
  company (Nakhla Trading LLC), and anonymised competitors.

  Do not copy any figure from this file into a proposal. Do not let it drift into
  apps/web. See PROTOTYPE-NOTES.md for the milestone debt it runs ahead of.
  ============================================================================
-->

<script>
"use strict";

/* ===========================================================================
   1. THE COMPANY, AND THE EIGHT PEOPLE IN IT
   ---------------------------------------------------------------------------
   INVENTED. The company does not exist and no figure here was measured.

   The important structure is `PEOPLE`. Each person carries their own navigation
   and their own landing section, so the application is assembled per user rather
   than filtered per user. That distinction is the whole point of this file: a
   Sales manager has no Finance entry to grey out, because Finance was never part
   of their product.
   =========================================================================== */

const CO = {
  name:'Nakhla Trading LLC', domain:'nakhla-trading.om',
  industry:'Industrial supplies & distribution', country:'Oman',

function deltaEl(text, dir) {
  return `<span class="delta ${dir}">${dir === 'up' ? '▲' : dir === 'down' ? '▼' : '—'} ${esc(text)}</span>`;
}
const srcChips = (l) => l.map((x) => `<span class="chip src">source: ${esc(x)}</span>`).join(' ');

/** A metric tile with its working. Same component as v1 — it is the product's
 *  central claim and should look identical wherever it appears. */
function tile(m, keyPrefix, i) {
  const key = `${keyPrefix}-${i}`;
  const open = S.open.has(key);
  return `<div class="card metric">
    <div class="top"><span class="label">${esc(m.label)}</span>${illus()}</div>
    <div class="row" style="gap:6px; align-items:flex-end">
      <span class="val">${esc(m.val)}</span>
      ${m.unit ? `<span class="unit" style="padding-bottom:3px">${esc(m.unit)}</span>` : ''}
    </div>
    ${m.delta ? deltaEl(m.delta, m.dir || 'flat') : ''}
    ${m.src ? `<div class="row wrap" style="gap:5px">${srcChips(m.src)}</div>` : ''}
    ${m.trail ? `<button class="why" onclick="tog('${key}')" aria-expanded="${open}">
      ${open ? '− hide the working' : '+ why this number'}</button>
      ${open ? `<div class="trail">${m.trail.map(([k, v]) =>
        `<div><span>${esc(k)}</span><span>${esc(v)}</span></div>`).join('')}</div>` : ''}` : ''}
  </div>`;
}
function tog(k) { S.open.has(k) ? S.open.delete(k) : S.open.add(k); render(); }

function sparkline(series, w, h, colour) {
  w = w || 240; h = h || 44; colour = colour || 'var(--steel-500)';
  const min = Math.min(...series), max = Math.max(...series), span = max - min || 1;
  const pts = series.map((v, i) => [
    (i / (series.length - 1)) * (w - 4) + 2, h - 3 - ((v - min) / span) * (h - 8)
  ]);
  const d = pts.map((pt, i) => `${i ? 'L' : 'M'}${pt[0].toFixed(1)} ${pt[1].toFixed(1)}`).join(' ');
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" preserveAspectRatio="none" aria-hidden="true">
    <path d="${d} L${w-2} ${h} L2 ${h} Z" fill="${colour}" opacity=".1"/>
    <path d="${d}" fill="none" stroke="${colour}" stroke-width="2" stroke-linecap="round"/>
    <circle cx="${pts[pts.length-1][0].toFixed(1)}" cy="${pts[pts.length-1][1].toFixed(1)}" r="3" fill="${colour}"/>
  </svg>`;
}

function donut(pct, size, colour) {
  size = size || 92; colour = colour || 'var(--steel-500)';
  const r = size / 2 - 7, c = 2 * Math.PI * r;
  return `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" aria-hidden="true">
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--bone-200)" stroke-width="7"/>
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${colour}" stroke-width="7"
      stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-pct/100)}"
      transform="rotate(-90 ${size/2} ${size/2})"/>
    <text x="50%" y="50%" text-anchor="middle" dy=".35em"
      style="font-family:var(--font-display); font-size:${size*0.29}px; fill:var(--ink-800)">${pct}</text></svg>`;
}

/** The permanent answer to "whose product am I looking at?" */
function scopeStrip() {
  const p = me();
  return `<div class="scopeStrip">

    <span class="sm" style="color:var(--steel-700); margin-left:auto">${esc(p.sees)}</span>
  </div>`;
}

/* ===========================================================================
   5. ONBOARDING
   ---------------------------------------------------------------------------
   Mirrors the real API's sequence rather than an idealised one: verify email →
   claim the domain by DNS TXT → answer the profile questions → connect sources →
   upload documents → invite the team.

   The domain claim is the step worth dwelling on with a client. Until it passes,
   the workspace is ephemeral and the audit stays reduced, because anyone can type
   a competitor's address. It is a trust feature, not a hurdle.
   =========================================================================== */

const ONBOARD = [
  { key:'verify',  title:'Verify your email',            sub:'We sent a link to layla@nakhla-trading.om' },
  { key:'domain',  title:'Prove you own the domain',     sub:'One DNS record. This is what unlocks the full audit.' },
  { key:'profile', title:'Tell NEXUS about the business', sub:'Six questions. These become the first facts in your Company Brain.' },
  { key:'connect', title:'Connect your tools',           sub:'Each connection unlocks the departments that depend on it.' },
  { key:'docs',    title:'Add your documents',           sub:'Price lists, catalogues, contracts, plans.' },
  { key:'team',    title:'Invite your team',             sub:'Role decides which workspace each person gets.' },
  { key:'done',    title:'Building your Company Brain',  sub:'' }
];

function stepBar() {
  return `<div class="steps">${ONBOARD.map((_, i) =>
    `<span class="s ${i < S.step ? 'done' : i === S.step ? 'now' : ''}"></span>`).join('')}</div>`;
}
function onboardNext() {
  if (S.step < ONBOARD.length - 1) { S.step++; render(); window.scrollTo(0, 0); } else signIn('layla');
}
function onboardBack() {
  if (S.step > 0) { S.step--; render(); window.scrollTo(0, 0); } else go('signup');
}

function viewOnboarding() {
  const step = ONBOARD[S.step];
  const wide = ['profile', 'connect', 'docs', 'team'].includes(step.key);
  return `<div class="screen on"><div class="centre" style="align-items:start; padding-top:44px">
    <div class="rise" style="width:100%; max-width:${wide ? '820px' : '460px'}">
      <div style="text-align:center; margin-bottom:22px">${logo()}</div>
      <div class="card" style="padding:26px">
        ${stepBar()}
        <div class="between wrap" style="margin-bottom:4px">
          <h2 style="font-size:21px">${esc(step.title)}</h2>
          <span class="mono tiny muted">Step ${S.step + 1} of ${ONBOARD.length}</span>
        </div>
        ${step.sub ? `<p class="sm muted" style="margin-bottom:20px">${esc(step.sub)}</p>` : '<div style="height:12px"></div>'}
        ${onboardBody(step.key)}
      </div>
      <p class="tiny muted mono" style="text-align:center; margin-top:14px">
        Demo only &mdash; no email is sent, no DNS is checked, nothing is uploaded.</p>
    </div>
  </div></div>`;
}

function onboardBody(key) {
  const nav = (label, back) => `
    <div class="row" style="gap:10px; margin-top:22px">
      ${back === false ? '' : '<button class="btn ghost" onclick="onboardBack()">Back</button>'}
      <button class="btn" style="flex:1" onclick="onboardNext()">${esc(label)} →</button>
    </div>`;

  if (key === 'verify') return `
    <div style="text-align:center; padding:12px 0 4px">
      <div style="width:56px; height:56px; margin:0 auto 14px; border-radius:50%; background:var(--gold-100); display:grid; place-items:center; font-size:24px">✉</div>

      a data source or claim a domain.</p>
      <div class="chip" style="margin-top:14px">Link expires in 24 hours</div>
    </div>
    ${nav('I have verified', false)}`;

  if (key === 'domain') return `
    <div class="card tint" style="padding:14px; box-shadow:none">
      <div class="mono tiny muted" style="text-transform:uppercase; letter-spacing:.12em">Add this TXT record to ${esc(CO.domain)}</div>
      <div class="mono sm" style="margin-top:9px; padding:11px; background:#fff; border:1px solid var(--bone-300); border-radius:9px; word-break:break-all">
        nexus-verify=8f3a91c7d24e6b05a1f8</div>
      <div class="row wrap" style="gap:7px; margin-top:10px">
        <span class="chip">Host: @</span><span class="chip">Type: TXT</span><span class="chip">TTL: 3600</span>
      </div>
    </div>
    <div class="brief" style="margin-top:14px">
      <span class="rail"></span>
      <div>
        <div class="sm" style="font-weight:500">Why this step exists</div>
        <p class="sm muted" style="margin-top:4px">Until the domain is verified, NEXUS will not name your
        competitors or pull keyword data &mdash; because anyone can type someone else&rsquo;s web address
        into the audit. Verification is what separates your business from a stranger&rsquo;s.</p>
      </div>
    </div>
    ${nav('Check the record')}`;

  if (key === 'profile') {
    const q = [
      ['What does the business sell?', 'input', CO.industry],
      ['Who is the typical customer?', 'input', 'Contractors and facilities teams in Muscat, Sohar and Salalah'],

      ['What is the reporting currency?', 'select', ['OMR — Omani rial','AED — UAE dirham','SAR — Saudi riyal']],
      ['When does your financial year end?', 'select', ['31 December','31 March','30 June']],

    ];

      <div class="grid g2">
        ${q.map(([label, kind, val]) => `
          <div class="field" ${kind === 'textarea' ? 'style="grid-column:1/-1"' : ''}>

            ${kind === 'select'
              ? `<select class="input">${val.map((o) => `<option>${esc(o)}</option>`).join('')}</select>`
              : kind === 'textarea'
                ? `<textarea class="input">${esc(val)}</textarea>`
                : `<input class="input" value="${esc(val)}">`}
          </div>`).join('')}
      </div>
      <p class="hint">These answers are stored as L1 and L2 facts and are cited whenever a recommendation
      depends on them &mdash; so you can always see why NEXUS said something.</p>
      ${nav('Save and continue')}`;
  }

  if (key === 'connect') return `
    <div class="grid g2">
      ${D.integrations.map((x) => {
        const on = x.status === 'connected', err = x.status === 'error';
        return `<div class="card" style="padding:14px">
          <div class="between">
            <span class="sm" style="font-weight:500">${esc(x.name)}</span>
            <span class="chip ${on ? 'good' : err ? 'warn' : ''}">${on ? '✓ connected' : err ? '! needs attention' : 'available'}</span>
          </div>
          <div class="row wrap" style="gap:6px; margin-top:9px">
            <span class="chip lock">reads at ${esc(x.scope)}</span>
            ${on ? `<span class="chip">synced ${esc(x.last)}</span>` : ''}
          </div>
          ${!on ? '<button class="btn ghost sm" style="margin-top:11px; width:100%">Connect</button>' : ''}
        </div>`;
      }).join('')}
    </div>
    <p class="hint">A connection only ever reads. NEXUS never writes to your CRM or accounting system
    without an explicit, confirmed action.</p>
    ${nav('Continue')}`;

  if (key === 'docs') return `
    <div class="card tint" style="border-style:dashed; text-align:center; padding:28px; box-shadow:none">
      <div style="font-size:26px">⇪</div>
      <div class="sm" style="margin-top:8px; font-weight:500">Drop files here</div>
      <p class="hint" style="margin-top:4px">PDF, Word, Excel, PowerPoint. A scanned PDF with no text layer
      will fail visibly rather than be indexed as empty.</p>
    </div>
    <div style="margin-top:16px">
      <div class="between" style="margin-bottom:6px">
        <span class="mono tiny muted" style="text-transform:uppercase; letter-spacing:.12em">Indexed so far</span>${illus()}
      </div>
      ${D.brain.filter((b) => b.kind === 'Document').map((b) => `
        <div class="between" style="padding:10px 2px; border-bottom:1px solid var(--bone-100)">
          <div>
            <div class="sm">${esc(b.title)}</div>
            <div class="tiny muted mono">${b.chunks} passages indexed</div>
          </div>
          <span class="chip ${b.scope >= 4 ? 'warn' : 'lock'}">${esc(SCOPE_NAMES[b.scope])}</span>
        </div>`).join('')}

    <p class="hint">Every document is classified on upload. Anything NEXUS is unsure about is held for your

    ${nav('Continue')}`;

  if (key === 'team') return `
    <div class="grid g2" style="gap:10px">
      <div class="field" style="margin:0"><label>Email</label><input class="input" placeholder="name@nakhla-trading.om"></div>
      <div class="field" style="margin:0"><label>Role</label>
        <select class="input">${ROLE_REACH.map((r) => `<option>${esc(r[0])}</option>`).join('')}</select>
      </div>
    </div>
    <button class="btn ghost sm" style="margin-top:12px">+ Add another</button>
    <div style="margin-top:18px">
      <div class="between" style="margin-bottom:9px">
        <span class="mono tiny muted" style="text-transform:uppercase; letter-spacing:.14em">What each role reaches</span>
        <span class="chip good">Real &mdash; from the built model</span>
      </div>
      <table>
        <thead><tr><th>Role</th><th>Max sensitivity</th><th>Departments</th><th>Their workspace</th></tr></thead>
        <tbody>
          ${ROLE_REACH.map(([label, scope, depts, ws]) => `<tr>

            <td class="mono tiny">${scope ? esc(SCOPE_NAMES[scope]) : '<span class="muted">Nothing by role</span>'}</td>
            <td class="tiny muted">${esc(depts)}</td>
            <td class="tiny muted">${esc(ws)}</td>
          </tr>`).join('')}
        </tbody>

    ${nav('Send invitations')}`;

  /* done */
  const tasks = [
    ['Website crawled','47 pages'], ['Documents indexed','584 passages'],
    ['CRM synced','1,240 records'], ['Accounting synced','18 months of ledger'],

function signIn(id) {
  S.me = PEOPLE.find((p) => p.id === id);
  S.section = S.me.nav[0][0];
  S.route = 'app';
  S.open.clear();
  render();
  window.scrollTo(0, 0);
}

function signOut() { S.me = null; S.section = null; S.route = 'signin'; render(); window.scrollTo(0, 0); }

/** Leave the application entirely and return to the public site. */
function exitToSite() { S.me = null; S.section = null; go('landing'); }

/** Every workspace closes with the same honest note. */
function footNote() {
  return `<p class="hint" style="margin-top:26px; max-width:46rem">
    In the real product every figure here is computed from a connected source and can be opened
    to its raw inputs. In this prototype they are invented for illustration.</p>`;
}

/* ===========================================================================
   8. SECTIONS
   ---------------------------------------------------------------------------
   One function per section. Note how little they have in common: a pipeline
   board, an ageing profile and a dispatch lane are not the same widget with
   different numbers in it. That is the point — each director's workspace is
   shaped like the job, not like a reporting template.
   =========================================================================== */

function section() {
  const k = S.section;
  const fn = SECTIONS[k];
  if (!fn) return `<div class="panel">Section not built in this prototype.</div>`;
  return scopeStrip() + fn();
}

/* ===========================================================================
   9. ROUTER
   =========================================================================== */

const VIEWS = {
  landing:    viewLanding,
  signup:     viewSignup,
  onboarding: viewOnboarding,
  signin:     viewSignIn,
  app:        viewApp
};

function render() {
  /* `app` is the only route that needs somebody signed in. Falling back to the
     picker rather than erroring means a stale deep link cannot dead-end. */
  const route = S.route === 'app' && !S.me ? 'signin' : S.route;
  $('#screens').innerHTML = (VIEWS[route] || viewLanding)();

  document.title = route === 'app' && S.me
    ? `NEXUS OS — ${S.me.deptLabel} · ${S.me.name.split(' ')[0]} (illustrative data)`
    : `NEXUS OS — ${route} (illustrative data)`;

  const hash = route === 'app' && S.me ? S.me.id : route;
  if (location.hash.slice(1) !== hash) history.replaceState(null, '', '#' + hash);
}

function go(route) {
  S.route = route;
  if (route === 'onboarding') S.step = 0;
  render();
  window.scrollTo(0, 0);
}

/* Deep links: `#landing`, `#onboarding`, or a person's id such as `#mariam`. */
window.addEventListener('hashchange', () => {
  const h = location.hash.slice(1);
  const person = PEOPLE.find((x) => x.id === h);
  if (person && person !== S.me) { signIn(person.id); return; }
  if (VIEWS[h] && h !== S.route) go(h);
});

Object.assign(window, {
  go, signIn, signOut, exitToSite, goSection, tog, render, runPreview,
  onboardNext, onboardBack, S, PEOPLE, SECTIONS, D, VIEWS
});

(function boot() {
  const h = location.hash.slice(1);
  const person = PEOPLE.find((x) => x.id === h);
  if (person) { signIn(person.id); return; }
  if (VIEWS[h]) S.route = h;
  render();
})();
