[project]
name = "nexus-api"
version = "0.1.0"
description = "NEXUS OS — API. Grounding, scoped retrieval, deterministic calculators."
requires-python = ">=3.12"

dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic[email]>=2.9",
  "pydantic-settings>=2.6",
  "sqlalchemy>=2.0.36",
  "alembic>=1.14",
  "asyncpg>=0.30",
  "pgvector>=0.3.6",
  "argon2-cffi>=23.1",
  "itsdangerous>=2.2",
  "httpx>=0.28",
  "tenacity>=9.0",
  "structlog>=24.4",
  # Scheduler for expiry sweeps and, later, crawls and score recomputation.
  "apscheduler>=3.10",
  # DNS TXT lookups for domain verification; the stdlib resolves addresses only.
  "dnspython>=2.7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  # starlette >=1.6 deprecates httpx for TestClient in favour of httpx2.
  # Test-only: application code still uses httpx (a runtime dependency above).
  "httpx2>=0.1",
  # Test-only sync driver. The isolation suite asserts a *database* behaviour
  # (RLS) rather than application behaviour, so it runs plain synchronous SQL
  # as the real app role; the app itself stays on asyncpg.
  "psycopg2-binary>=2.9",
  "ruff>=0.8",
  "mypy>=1.13",
  "types-python-dateutil",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ─────────────────────────────────────────────────────────────
# Lint
# ─────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["."]

[tool.ruff.lint]
select = [
  "E", "F", "W",      # pycodestyle, pyflakes
  "I",                # import sorting
  "N",                # naming
  "UP",               # pyupgrade
  "B",                # bugbear
  "A",                # builtin shadowing
  "S",                # bandit — security
  "T20",              # no print()
  "RUF",
]
ignore = [
  "S101",  # assert is fine in tests
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]

# ─────────────────────────────────────────────────────────────
# Types — strict from M0, per doc 07 §3
# ─────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
disallow_any_generics = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# No type stubs published upstream.
module = ["pgvector.*", "fastembed.*", "apscheduler.*"]
ignore_missing_imports = true

# ─────────────────────────────────────────────────────────────
# Tests
# ─────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["error"]
