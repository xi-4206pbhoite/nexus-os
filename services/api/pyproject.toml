[project]
name = "nexus-api"
version = "0.1.0"
description = "NEXUS OS — API. Grounding, scoped retrieval, deterministic calculators."
requires-python = ">=3.12"

dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic[email]>=2.9",
  "pydantic-settings>=2.6",
  "sqlalchemy>=2.0.36",
  "alembic>=1.14",
  "asyncpg>=0.30",
  "pgvector>=0.3.6",
  "argon2-cffi>=23.1",
  "itsdangerous>=2.2",
  "httpx>=0.28",
  "tenacity>=9.0",
  "structlog>=24.4",
  # Scheduler for expiry sweeps and, later, crawls and score recomputation.
  "apscheduler>=3.10",
  # DNS TXT lookups for domain verification; the stdlib resolves addresses only.
  "dnspython>=2.7",
  # Multipart form parsing. A runtime dependency, not a test one: the document
  # upload route accepts a file plus a consent field, and FastAPI raises at
  # import time without it.
  "python-multipart>=0.0.20",
  # Document parsing (M5). No OCR: a scanned PDF must fail visibly,
  # not be silently indexed as an empty document.
  "pypdf>=5.1",
  "python-docx>=1.1",
  "python-pptx>=1.0",
  "openpyxl>=3.1",
]

[project.optional-dependencies]
# The language model is OPTIONAL. The product runs fully without it, reporting
# an honest unavailable state, so the SDK is not a base dependency. Install with
#   pip install -e ".[ai]"
# when a key is available. `app/ai/anthropic_provider.py` imports it lazily and
# `app/ai/registry.py` never reaches for it without a key, so its absence costs
# nothing at startup.
ai = [
  "anthropic>=0.40",
]
# Semantic search is OPTIONAL for the same reason, and more heavily: ADR 0003
# chose a LOCAL model so document text is never sent anywhere to be embedded,
# and multilingual-e5-large is a ~2GB download. Install with
#   pip install -e ".[embeddings]"
# Until then `app/embeddings/registry.py` returns an embedder reporting
# `unconfigured`, documents still upload, parse and classify, and their chunks
# are stored with a NULL embedding — which migration 0007's provenance
# constraint permits. They are simply not yet searchable, and the product says
# so rather than ranking them by nothing.
embeddings = [
  "fastembed>=0.4",
]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  # starlette >=1.6 deprecates httpx for TestClient in favour of httpx2.
  # Test-only: application code still uses httpx (a runtime dependency above).
  "httpx2>=0.1",
  # Test-only sync driver. The isolation suite asserts a *database* behaviour
  # (RLS) rather than application behaviour, so it runs plain synchronous SQL
  # as the real app role; the app itself stays on asyncpg.
  "psycopg2-binary>=2.9",
  "ruff>=0.8",
  "mypy>=1.13",
  "types-python-dateutil",
  "types-openpyxl",
  # Coverage with a floor. The floor exists to make a deletion of tests visible;
  # it starts at the measured number and is never lowered to make a build pass.
  "pytest-cov>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ─────────────────────────────────────────────────────────────
# Lint
# ─────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["."]

[tool.ruff.lint]
select = [
  "E", "F", "W",      # pycodestyle, pyflakes
  "I",                # import sorting
  "N",                # naming
  "UP",               # pyupgrade
  "B",                # bugbear
  "A",                # builtin shadowing
  "S",                # bandit — security
  "T20",              # no print()
  "RUF",
]
ignore = [
  "S101",  # assert is fine in tests
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]

# ─────────────────────────────────────────────────────────────
# Types — strict from M0, per doc 07 §3
# ─────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
disallow_any_generics = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# No type stubs published upstream.
module = ["pgvector.*", "fastembed.*", "apscheduler.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# `anthropic` is an OPTIONAL dependency, deliberately not installed by default.
# The product is required to run with no language model configured, so the SDK
# is imported lazily inside app/ai/anthropic_provider.py and its absence is a
# supported state. Without this, mypy fails on a package that is *meant* to be
# missing until the integration is switched on.
module = ["anthropic.*"]
ignore_missing_imports = true

# ─────────────────────────────────────────────────────────────
# Tests
# ─────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["error"]

# --strict-markers: a misspelled marker is an error, not a silent no-op. Nine
#   modules previously kept `requires_db` as a local `skipif` variable, so a
#   tenth misspelling it would have applied nothing at all.
# --strict-config: an unknown key in this table is an error too.
# --cov-fail-under: the floor, set to the measured figure (74.2% at Phase 0,
#   branch coverage) and
#   rounded down so it cannot flake on a fraction. It exists to make a deleted
#   test visible, so it goes up and never down. A coverage figure is not a
#   quality claim - 74% here sits beside four of ten invariants proved - it is
#   only a ratchet.
addopts = "--strict-markers --strict-config --cov=app --cov-report=term-missing:skip-covered --cov-fail-under=74"

# Skipped only when no database is configured — and conftest.py fails the
# session when that happens, because a database test that does not run proves
# nothing. tests/test_ci_contract.py asserts the other half.
markers = [
  "requires_db: needs a real PostgreSQL, connected as the unprivileged app role",
]

[tool.coverage.run]
source = ["app"]
# Both halves of every branch, not just every line. A permission predicate with
# only its allow path exercised is the failure mode this guards against, and
# line coverage cannot see it.
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
